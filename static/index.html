<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J.A.R.V.I.S. ZERO</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#eee;background:#0b0b10}body{margin:0}.wrap{max-width:900px;margin:35px auto;padding:20px}header{border-bottom:1px solid #34303f;padding-bottom:18px}h1{letter-spacing:.18em;color:#b99aff}small{color:#aaa}main{margin:24px 0;min-height:250px;white-space:pre-wrap;line-height:1.6;background:#15131e;padding:24px;border-radius:14px}textarea,input{box-sizing:border-box;width:100%;background:#1c1927;color:white;border:1px solid #514264;border-radius:9px;padding:12px;margin:7px 0;font:inherit}button{background:#8156cc;border:0;color:white;border-radius:8px;padding:12px 18px;cursor:pointer;margin:5px 0}button:hover{background:#9b70e5}a{color:#c7a7ff;overflow-wrap:anywhere}.sources{margin-top:18px}.hint{color:#aaa;font-size:13px}
</style></head><body><div class="wrap"><header><h1>J.A.R.V.I.S.</h1><small>ZERO · Recherche sourcée · Mémoire · Réseau neuronal indépendant</small></header><label>Token d'accès (gardé uniquement dans cet onglet)</label><input type="password" id="token" autocomplete="off" placeholder="JARVIS_TOKEN"><label>Ta question</label><textarea id="q" rows="3" placeholder="Pose une question..."></textarea><button id="ask">Rechercher et répondre</button><main id="answer">En attente de ta question.</main><section id="sources" class="sources"></section><h3>Corriger J.A.R.V.I.S.</h3><textarea id="correction" rows="3" placeholder="Écris une correction validée..."></textarea><button id="feedback">Enregistrer la correction</button><p class="hint" id="status">Les sources externes peuvent contenir des erreurs. La correction améliore la mémoire et entraîne le classificateur, pas un modèle génératif.</p></div><script>
const $=id=>document.getElementById(id);let last='';async function call(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.detail||r.status);return j}
$('ask').onclick=async()=>{last=$('q').value;$('answer').textContent='Recherche Internet en cours…';$('sources').replaceChildren();try{let r=await call('/api/ask',{question:last});$('answer').textContent=r.answer;for(const s of r.sources){let p=document.createElement('p'),a=document.createElement('a');a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='['+s.id+'] '+s.title;p.append(a);$('sources').append(p)}}catch(e){$('answer').textContent='Erreur : '+e.message}};
$('feedback').onclick=async()=>{try{let r=await call('/api/feedback',{question:last,correction:$('correction').value});$('status').textContent=r.note}catch(e){$('status').textContent='Erreur : '+e.message}};
</script></body></html>
